# ==================== Server ====================
server.port=8080
server.servlet.context-path=/api

# ==================== Application ====================
spring.application.name=java-enterprise-portfolio

# ==================== H2 Database (in-memory) ====================
spring.datasource.url=jdbc:h2:mem:enterprisedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (development only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==================== JPA / Hibernate ====================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==================== JWT Configuration ====================
# Secret Base64 (minimal 256-bit / 32 byte untuk HS256).
# Production: WAJIB override via environment variable JWT_SECRET.
app.jwt.secret=${JWT_SECRET:Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tMTIzNDU2Nzg5MC1hYmNkZWZnaGlqa2xtbm9wcXJzdHV2d3h5eg==}
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=86400000
app.jwt.issuer=java-enterprise-portfolio

# ==================== Actuator ====================
management.endpoints.web.exposure.include=health,info,metrics,env,loggers
management.endpoint.health.show-details=always
management.info.env.enabled=true

# ==================== Logging ====================
logging.level.com.example.enterprise=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ==================== Jackson ====================
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# ==================== OpenAPI / Swagger ====================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
