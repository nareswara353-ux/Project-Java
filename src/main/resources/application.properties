server.port=8080
server.servlet.context-path=/api

spring.application.name=java-enterprise-portfolio
spring.threads.virtual.enabled=true

spring.datasource.url=jdbc:h2:mem:enterprisedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tMTIzNDU2Nzg5MC1hYmNkZWZnaGlqa2xtbm9wcXJzdHV2d3h5eg==}
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=86400000
app.jwt.issuer=java-enterprise-portfolio

app.audit.retention-days=90
app.audit.cleanup-cron=0 0 3 * * ?

management.endpoints.web.exposure.include=health,info,metrics,env,loggers
management.endpoint.health.show-details=always
management.info.env.enabled=true

logging.level.com.example.enterprise=DEBUG
logging.level.com.example.enterprise.infrastructure.security=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
