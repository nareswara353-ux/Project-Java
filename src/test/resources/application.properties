server.servlet.context-path=/api

spring.application.name=java-enterprise-portfolio-test

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=false

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.jwt.secret=Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tMTIzNDU2Nzg5MC1hYmNkZWZnaGlqa2xtbm9wcXJzdHV2d3h5eg==
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=86400000
app.jwt.issuer=java-enterprise-portfolio

management.endpoints.web.exposure.include=health

logging.level.com.example.enterprise=INFO
logging.level.com.example.enterprise.infrastructure.security=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{20} - %msg%n

spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
