groups:
  - name: application
    interval: 30s
    rules:
      - alert: ApplicationDown
        expr: up{job="java-enterprise-portfolio"} == 0
        for: 1m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Java Enterprise Portfolio is DOWN"
          description: "Application {{ $labels.instance }} has been down for more than 1 minute."
          runbook_url: "https://github.com/nareswara353-ux/Project-Java/blob/main/CONTRIBUTING.md"

      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_server_requests_seconds_count{job="java-enterprise-portfolio",status=~"5.."}[5m]))
            /
            sum(rate(http_server_requests_seconds_count{job="java-enterprise-portfolio"}[5m]))
          ) > 0.05
        for: 2m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "High HTTP 5xx error rate"
          description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes (threshold: 5%)."

      - alert: CircuitBreakerOpen
        expr: resilience4j_circuitbreaker_state{name="eventPublisher",state="open"} == 1
        for: 30s
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Circuit breaker 'eventPublisher' is OPEN"
          description: "Event publisher circuit breaker opened due to repeated failures. Event publishing is degraded."

      - alert: HighHeapUsage
        expr: |
          (
            sum(jvm_memory_used_bytes{job="java-enterprise-portfolio",area="heap"})
            /
            sum(jvm_memory_max_bytes{job="java-enterprise-portfolio",area="heap"})
          ) > 0.85
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "JVM heap usage is high"
          description: "Heap usage is {{ $value | humanizePercentage }} (threshold: 85%). Consider scaling or GC tuning."

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(http_server_requests_seconds_bucket{job="java-enterprise-portfolio"}[5m]))
          ) > 1.0
        for: 3m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "P95 latency exceeds 1 second"
          description: "P95 latency is {{ $value }}s over the last 5 minutes (threshold: 1s)."
