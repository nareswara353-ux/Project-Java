global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: java-enterprise-portfolio
    environment: local

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: java-enterprise-portfolio
    metrics_path: /api/actuator/prometheus
    scrape_interval: 10s
    static_configs:
      - targets:
          - app:8080
        labels:
          application: java-enterprise-portfolio
