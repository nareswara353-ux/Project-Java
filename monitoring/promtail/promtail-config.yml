server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576
    backoff_config:
      min_period: 500ms
      max_period: 5m
      max_retries: 10

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - source_labels: ['__meta_docker_container_image']
        target_label: 'image'
    pipeline_stages:
      - json:
          expressions:
            level: level
            logger: logger_name
            message: message
            thread: thread_name
            app: app
            timestamp: '"@timestamp"'
      - labels:
          level:
          logger:
          app:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
          action_on_failure: skip
      - match:
          selector: '{level="ERROR"}'
          stages:
            - regex:
                expression: '.*'
            - labels:
                severity_class: "error"
      - match:
          selector: '{level="WARN"}'
          stages:
            - regex:
                expression: '.*'
            - labels:
                severity_class: "warn"
